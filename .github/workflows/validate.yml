name: validate
on:
  push:
    branches: [main, plex-server-improvements]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: ci/requirements.txt
    - name: Install pinned validation dependencies
      run: |
        python -m pip install -r ci/requirements.txt
        python scripts/install-ci-tools.py --destination "$RUNNER_TEMP/media-tools"
        echo "$RUNNER_TEMP/media-tools" >> "$GITHUB_PATH"
    - name: Validate infrastructure and manifests
      run: ./scripts/validate.sh
    - name: Verify public image availability and architectures
      run: python scripts/validate-images.py "$RUNNER_TEMP"/media-rendered/*.yaml
  startup:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - name: Install pinned smoke-test dependencies
      run: |
        python -m pip install -r ci/requirements.txt
        python scripts/install-ci-tools.py --destination "$RUNNER_TEMP/media-tools"
        echo "$RUNNER_TEMP/media-tools" >> "$GITHUB_PATH"
    - name: Start real applications behind Traefik in an isolated cluster
      run: ./scripts/smoke-cluster.sh
