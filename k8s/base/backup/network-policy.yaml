# The API service DNATs to a K3s node, so allow both service and host API ports.
# Limit this exception to backup pods; other applications keep their current policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup-kubernetes-api
  namespace: media
spec:
  podSelector:
    matchLabels:
      app: config-backup
  policyTypes: [Egress]
  egress:
  - to:
    - ipBlock:
        cidr: 10.0.0.0/8
    - ipBlock:
        cidr: 172.16.0.0/12
    - ipBlock:
        cidr: 192.168.0.0/16
    ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
