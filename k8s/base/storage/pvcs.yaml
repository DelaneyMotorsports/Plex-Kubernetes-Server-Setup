# Shared media/downloads claim — one RWX NFS volume from the NAS (see media-pv.yaml).
# Both /media and /downloads are subPaths of this single claim so hardlinks work.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-nfs-pvc
  namespace: media
  labels:
    app.kubernetes.io/part-of: media-stack
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: media-nfs
  volumeName: media-nfs-pv
  resources:
    requests:
      storage: 100Ti
---
