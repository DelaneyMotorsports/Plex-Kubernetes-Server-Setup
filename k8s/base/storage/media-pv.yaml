# PersistentVolume for the shared media library + downloads, served over NFS by the NAS
# (the separate "Nomad" box). A single export holds BOTH trees so Sonarr/Radarr imports
# are instant hardlinks instead of slow cross-filesystem copies:
#
#   <export>/                 <- nfs.path below (e.g. /export/media)
#     ├── media/              <- mounted into pods at /media   (subPath: media)
#     │     ├── tv/
#     │     ├── movies/
#     │     └── music/
#     └── downloads/          <- mounted into pods at /downloads (subPath: downloads)
#           ├── complete/
#           └── incomplete/
#
# REQUIRED before applying (GitOps-friendly: set these in overlays/pi5/nas-patch.yaml):
#   1. nfs.server → your NAS LAN IP
#   2. nfs.path   → the exported directory on the NAS
# On the NAS, the export must be owned by PUID/PGID 1000 (see configmap.yaml) and exported
# so writes as 1000 succeed (e.g. no_root_squash, or all_squash + anonuid/anongid=1000).
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-nfs-pv
  labels:
    type: media
    app.kubernetes.io/part-of: media-stack
spec:
  capacity:
    storage: 100Ti           # NFS ignores capacity; set high so the claim always binds
  accessModes:
  - ReadWriteMany            # NFS supports RWX — pods on any node share it (multi-node ready)
  storageClassName: media-nfs
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
  - nfsvers=4.1
  - hard                     # retry indefinitely on NAS reboot instead of erroring (uptime)
  - noatime
  nfs:
    server: CHANGE-ME-NAS-IP # NAS LAN IP — override in overlays/pi5/nas-patch.yaml
    path: /export/media      # Exported dir holding media/ and downloads/ — override in overlay
