# Native sidecar startupProbe gates qBittorrent until VPN health succeeds.
# Gluetun maintains the kill switch; only cluster-local subnets bypass the VPN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gluetun-qbittorrent
  namespace: media
  labels:
    app.kubernetes.io/name: gluetun-qbittorrent
    app.kubernetes.io/part-of: media-stack
    app.kubernetes.io/component: download
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gluetun-qbittorrent
  template:
    metadata:
      labels:
        app: gluetun-qbittorrent
        app.kubernetes.io/part-of: media-stack
    spec:
      initContainers:
      - name: gluetun
        image: qmcgaw/gluetun:latest
        restartPolicy: Always
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        envFrom:
        - configMapRef:
            name: media-stack-config
        - secretRef:
            name: media-stack-secret
        volumeMounts:
        - name: gluetun-config
          mountPath: /gluetun
        readinessProbe:
          exec:
            command:
            - /gluetun-entrypoint
            - healthcheck
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - /gluetun-entrypoint
            - healthcheck
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        env:
        - name: HTTP_CONTROL_SERVER_ADDRESS
          value: 127.0.0.1:8000
        - name: FIREWALL
          value: 'on'
        - name: FIREWALL_INPUT_PORTS
          value: '8080'
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: 10.42.0.0/16,10.43.0.0/16
        - name: HEALTH_TARGET_ADDRESSES
          value: github.com:443
        - name: HEALTH_ICMP_TARGET_IPS
          value: 9.9.9.9,8.8.8.8
        - name: DNS_UPSTREAM_RESOLVERS
          value: quad9
        startupProbe:
          exec:
            command:
            - /gluetun-entrypoint
            - healthcheck
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
      containers:
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest
        envFrom:
        - configMapRef:
            name: media-stack-config
        env:
        - name: WEBUI_PORT
          value: '8080'
        ports:
        - name: webui
          containerPort: 8080
        - name: bittorrent-tcp
          containerPort: 6881
          protocol: TCP
        - name: bittorrent-udp
          containerPort: 6881
          protocol: UDP
        volumeMounts:
        - name: qbittorrent-config
          mountPath: /config
        - name: media-nfs
          mountPath: /downloads
          subPath: downloads
        startupProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 18
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: gluetun-config
        persistentVolumeClaim:
          claimName: gluetun-config-pvc
      - name: qbittorrent-config
        persistentVolumeClaim:
          claimName: qbittorrent-config-pvc
      - name: media-nfs
        persistentVolumeClaim:
          claimName: media-nfs-pvc
