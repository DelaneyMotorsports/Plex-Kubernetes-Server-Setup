# Pi 5 is intended for Direct Play; no hardware encoder is present on that SoC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: media
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/part-of: media-stack
    app.kubernetes.io/component: media-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
        app.kubernetes.io/part-of: media-stack
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: plex
        image: lscr.io/linuxserver/plex@sha256:9a1325bf0b34a50993a04be0bdcc7fab841d2a78161bd11b4db4ff8478a7ac2a
        envFrom:
        - configMapRef:
            name: media-stack-config
        - secretRef:
            name: media-stack-secret
        env:
        - name: VERSION
          value: docker
        ports:
        - name: plex
          containerPort: 32400
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media-nfs
          mountPath: /media
          subPath: media
          readOnly: true
        - name: transcode
          mountPath: /transcode
        securityContext:
          privileged: false
        startupProbe:
          httpGet:
            path: /identity
            port: 32400
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 24
        livenessProbe:
          httpGet:
            path: /identity
            port: 32400
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /identity
            port: 32400
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: 2000m
            memory: 3Gi
            ephemeral-storage: 10Gi
        imagePullPolicy: IfNotPresent
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: plex-config-pvc
      - name: media-nfs
        persistentVolumeClaim:
          claimName: media-nfs-pvc
      - name: transcode
        emptyDir:
          sizeLimit: 8Gi
