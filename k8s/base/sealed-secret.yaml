# ── media-stack-secret, the GitOps way (encrypted, safe to commit) ────────────
# This is a PLACEHOLDER. It ships empty so `kustomize build` works out of the box and
# Argo always has something to apply. Generate the real, encrypted version against YOUR
# cluster with:
#
#     ./scripts/seal-secrets.sh .env
#
# That overwrites this file with your WireGuard keys + Plex claim encrypted to your
# cluster's Sealed Secrets controller. Only that controller can decrypt it, so it is
# safe to commit to Git — which is what makes a full GitOps rebuild need zero manual
# secret entry. Until you run seal-secrets.sh, media-stack-secret is empty (the VPN and
# Plex claim are simply unset, same as a fresh install).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: media-stack-secret
  namespace: media
spec:
  encryptedData: {}
  template:
    metadata:
      name: media-stack-secret
      namespace: media
    type: Opaque
