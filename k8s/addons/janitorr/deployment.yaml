apiVersion: apps/v1
kind: Deployment
metadata:
  name: janitorr
  namespace: media
  labels:
    app.kubernetes.io/name: janitorr
    app.kubernetes.io/part-of: media-stack
    app.kubernetes.io/component: maintenance
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: janitorr
  template:
    metadata:
      labels:
        app: janitorr
        app.kubernetes.io/part-of: media-stack
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: janitorr
        image: ghcr.io/schaka/janitorr:jvm-stable@sha256:eecb604b6307f4ba5674bec7e3fc142d7212361571a1a9dc1f39e0fd069a4434
        envFrom:
        - configMapRef:
            name: media-stack-config
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media-nfs
          mountPath: /media
          subPath: media
        - name: config
          mountPath: /logs
          subPath: logs
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        imagePullPolicy: IfNotPresent
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: janitorr-config-pvc
      - name: media-nfs
        persistentVolumeClaim:
          claimName: media-nfs-pvc
