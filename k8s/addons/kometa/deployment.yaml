apiVersion: apps/v1
kind: Deployment
metadata:
  name: kometa
  namespace: media
  labels:
    app.kubernetes.io/name: kometa
    app.kubernetes.io/part-of: media-stack
    app.kubernetes.io/component: metadata
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kometa
  template:
    metadata:
      labels:
        app: kometa
        app.kubernetes.io/part-of: media-stack
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: kometa
        image: kometateam/kometa@sha256:4e45d12ca8cb21b5a47a25917542dbb305fc0c76a366bc692ae9490da35d168d
        envFrom:
        - configMapRef:
            name: media-stack-config
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        imagePullPolicy: IfNotPresent
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: kometa-config-pvc
