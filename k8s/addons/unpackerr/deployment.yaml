apiVersion: apps/v1
kind: Deployment
metadata:
  name: unpackerr
  namespace: media
  labels:
    app.kubernetes.io/name: unpackerr
    app.kubernetes.io/part-of: media-stack
    app.kubernetes.io/component: extraction
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unpackerr
  template:
    metadata:
      labels:
        app: unpackerr
        app.kubernetes.io/part-of: media-stack
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: unpackerr
        image: golift/unpackerr@sha256:fc8b69571033f197d4db5cf22a573acb3bb891c9f8033431b9a1fcf679ca3e9c
        envFrom:
        - configMapRef:
            name: media-stack-config
        env:
        - name: UN_SONARR_0_URL
          value: http://sonarr:8989
        - name: UN_RADARR_0_URL
          value: http://radarr:7878
        - name: UN_SONARR_0_API_KEY
          valueFrom:
            secretKeyRef:
              name: unpackerr-secret
              key: SONARR_API_KEY
        - name: UN_RADARR_0_API_KEY
          valueFrom:
            secretKeyRef:
              name: unpackerr-secret
              key: RADARR_API_KEY
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media-nfs
          mountPath: /downloads
          subPath: downloads
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 256Mi
        imagePullPolicy: IfNotPresent
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: unpackerr-config-pvc
      - name: media-nfs
        persistentVolumeClaim:
          claimName: media-nfs-pvc
