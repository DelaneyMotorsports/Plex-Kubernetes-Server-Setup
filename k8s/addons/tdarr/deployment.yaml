apiVersion: apps/v1
kind: Deployment
metadata:
  name: tdarr
  namespace: media
  labels:
    app.kubernetes.io/name: tdarr
    app.kubernetes.io/part-of: media-stack
    app.kubernetes.io/component: transcode
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tdarr
  template:
    metadata:
      labels:
        app: tdarr
        app.kubernetes.io/part-of: media-stack
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: tdarr
        image: ghcr.io/haveagitgat/tdarr@sha256:84743e5ae433a5b49cb463b2dff2679eb02f0cac24fb88c830f49bf8aa9f1c04
        envFrom:
        - configMapRef:
            name: media-stack-config
        env:
        - name: serverIP
          value: 0.0.0.0
        - name: serverPort
          value: '8266'
        - name: webUIPort
          value: '8265'
        - name: internalNode
          value: 'true'
        - name: inContainer
          value: 'true'
        - name: ffmpegVersion
          value: '6'
        - name: UMASK_SET
          value: '002'
        ports:
        - name: webui
          containerPort: 8265
        - name: server
          containerPort: 8266
        volumeMounts:
        - name: config
          mountPath: /app/configs
        - name: logs
          mountPath: /app/logs
        - name: media-nfs
          mountPath: /media
          subPath: media
        - name: transcode-cache
          mountPath: /temp
        - name: server
          mountPath: /app/server
        startupProbe:
          httpGet:
            path: /
            port: 8265
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 18
        livenessProbe:
          httpGet:
            path: /
            port: 8265
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8265
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 2Gi
          limits:
            cpu: 2000m
            memory: 2Gi
            ephemeral-storage: 40Gi
        imagePullPolicy: IfNotPresent
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: tdarr-config-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: tdarr-logs-pvc
      - name: media-nfs
        persistentVolumeClaim:
          claimName: media-nfs-pvc
      - name: transcode-cache
        emptyDir:
          sizeLimit: 32Gi
      - name: server
        persistentVolumeClaim:
          claimName: tdarr-server-pvc
