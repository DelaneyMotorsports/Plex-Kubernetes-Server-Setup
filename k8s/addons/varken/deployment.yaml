apiVersion: apps/v1
kind: Deployment
metadata:
  name: varken
  namespace: media
  labels:
    app.kubernetes.io/name: varken
    app.kubernetes.io/part-of: media-stack
    app.kubernetes.io/component: metrics
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: varken
  template:
    metadata:
      labels:
        app: varken
        app.kubernetes.io/part-of: media-stack
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: varken
        image: boerderij/varken@sha256:784aaf577c822a3e69c5b2792e0422896c8cdb0455e584cd5a4e46bca789848d
        envFrom:
        - configMapRef:
            name: media-stack-config
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        imagePullPolicy: IfNotPresent
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: varken-config-pvc
