# ── Fleet inventory ──────────────────────────────────────────────────────────
# This file describes every machine in the cluster. It is the "fleet as code":
# add a host here, run a playbook, and it is provisioned identically.
#
# Only the media/K3s COMPUTE boxes go here. The NAS (Nomad box) is NOT managed by
# this inventory — it lives on its own and is reached over NFS (see group_vars/all.yml).
all:
  vars:
    ansible_user: pi            # <-- EDIT: SSH user on the boxes (e.g. pi, ubuntu)
    # ansible_ssh_private_key_file: ~/.ssh/id_ed25519
  children:
    # Control-plane node(s). One for a single box; three for embedded-etcd HA.
    k3s_server:
      hosts:
        plex-box:
          ansible_host: 192.168.1.60   # <-- EDIT: the Plex/K3s box LAN IP
    # Worker node(s). Empty to start — add here (or via add-node.yml) to scale out.
    k3s_agent:
      hosts: {}
