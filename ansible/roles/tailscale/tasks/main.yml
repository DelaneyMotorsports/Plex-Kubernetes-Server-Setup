---
- name: Check whether Tailscale is installed
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: tailscale_bin
- name: Download Tailscale installer
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /var/tmp/tailscale-install.sh
    mode: "0700"
  when: not tailscale_bin.stat.exists
- name: Install Tailscale
  when: not tailscale_bin.stat.exists
  changed_when: true
  ansible.builtin.command:
    argv:
      - sh
      - /var/tmp/tailscale-install.sh
- name: Bring Tailscale up
  ansible.builtin.command: "tailscale up --authkey {{ tailscale_authkey }} --ssh --hostname {{ ansible_hostname }}\n"
  when: tailscale_authkey | length > 0
  changed_when: true
  no_log: true
- name: Warn if no auth key was provided
  ansible.builtin.debug:
    msg: "Tailscale installed but not connected — pass -e tailscale_authkey=tskey-... to join the tailnet."
  when: tailscale_authkey | length == 0
