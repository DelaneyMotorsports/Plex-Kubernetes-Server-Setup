---
- name: Check whether K3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_server_bin
- name: Download K3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /var/tmp/k3s-install.sh
    mode: "0700"
  when: not k3s_server_bin.stat.exists
- name: Install K3s server
  when: not k3s_server_bin.stat.exists
  changed_when: true
  ansible.builtin.command:
    argv: "{{ ['sh', '/var/tmp/k3s-install.sh', 'server'] + k3s_server_args }}"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
- name: Ensure K3s service is running and enabled
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
- name: Wait for the K3s node-token to be written
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 120
- name: Wait for the API server to be Ready
  ansible.builtin.command: k3s kubectl get --raw='/readyz'
  register: k3s_server_ready
  until: k3s_server_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false
- name: Install kubeconfig for the login user (remote kubectl access)
  when: ansible_user is defined
  block:
    - name: Ensure ~/.kube exists
      ansible.builtin.file:
        path: /home/{{ ansible_user }}/.kube
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"
    - name: Read the K3s kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_server_kubeconfig
      no_log: true
    - name: Copy kubeconfig with the real server address
      ansible.builtin.copy:
        content: "{{ k3s_server_kubeconfig.content | b64decode | replace('127.0.0.1', ansible_host | default(inventory_hostname)) }}"
        dest: /home/{{ ansible_user }}/.kube/config
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      no_log: true
    - name: Secure the kubeconfig
      ansible.builtin.file:
        path: /home/{{ ansible_user }}/.kube/config
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
