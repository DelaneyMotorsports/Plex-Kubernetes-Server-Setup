---
# The media Ingress objects all use `ingressClassName: nginx` with nginx.ingress.* annotations,
# so the cluster needs the ingress-nginx controller. K3s ships Traefik by default, which is
# disabled via k3s_server_args (see group_vars) so the two don't conflict.
- name: Install the ingress-nginx controller (baremetal provider)
  ansible.builtin.command: >
    k3s kubectl apply -f
    https://raw.githubusercontent.com/kubernetes/ingress-nginx/{{ ingress_nginx_version }}/deploy/static/provider/baremetal/deploy.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ingress_apply
  changed_when: "'created' in ingress_apply.stdout or 'configured' in ingress_apply.stdout"

- name: Wait for the ingress-nginx controller to be Available
  ansible.builtin.command: >
    k3s kubectl -n ingress-nginx rollout status deploy/ingress-nginx-controller --timeout=180s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

# The baremetal provider exposes the controller as a NodePort (high ports). Switch it to a
# LoadBalancer so K3s ServiceLB (klipper) binds the node's :80/:443 and forwards to it — this
# is what makes http://<service>.local work on plain port 80, the same slot Traefik used to hold.
# (Multi-node: swap ServiceLB for MetalLB with a dedicated address pool — see README roadmap.)
- name: Expose ingress-nginx on :80/:443 via ServiceLB
  ansible.builtin.command: >
    k3s kubectl -n ingress-nginx patch svc ingress-nginx-controller
    --type merge -p '{"spec":{"type":"LoadBalancer","externalTrafficPolicy":"Local"}}'
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ingress_svc_patch
  changed_when: "'patched' in ingress_svc_patch.stdout and 'no change' not in ingress_svc_patch.stdout"
