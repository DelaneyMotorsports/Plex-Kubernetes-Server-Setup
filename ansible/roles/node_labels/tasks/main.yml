---
# Label nodes so workloads can target hardware capabilities (e.g. a node with a GPU
# for transcoding). Runs on the control-plane node where kubectl is available.
- name: Label this node with its media capabilities
  ansible.builtin.command: >
    k3s kubectl label node {{ ansible_hostname }}
    media.delaneymotorsports.com/transcode=true --overwrite
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  delegate_to: "{{ groups['k3s_server'][0] }}"
  changed_when: false
